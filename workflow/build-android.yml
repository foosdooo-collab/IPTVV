name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Find Gradle wrapper
        id: gradle
        shell: bash
        run: |
          wrapper="$(find . -type f -name gradlew -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$wrapper" ]; then
            echo "No gradlew wrapper found in the repository."
            exit 1
          fi
          project_dir="$(dirname "$wrapper")"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Using Gradle wrapper: $wrapper"

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.gradle.outputs.project_dir }}"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
