name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # 1. Prevents the workflow from running on every normal comment unless it mentions OpenCode
    if: |
      contains(github.event.comment.body, '/oc') || 
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    
    # 2. Required permissions for OpenCode to read issues/PRs and post answers
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # Replace with your actual LLM provider key secret (e.g., ANTHROPIC_API_KEY, OPENAI_API_KEY, HF_TOKEN)
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} 
        with:
          # Define the model you want the agent to use
          model: anthropic/claude-sonnet-4-20250514
