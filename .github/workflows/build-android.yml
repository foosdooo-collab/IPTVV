name: Build Kivy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
    
      - name: Checkout
        uses: actions/checkout@v4
  - name: Set up Java 
  uses: actions/setup-java@v4
  with:
    distribution: temurin
    java-version: "17"
  - name: Set up Android SDK
  uses: android-actions/setup-android@v3

  - name: Accept Android SDK licenses
  run: yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses

  - name: Install Android SDK packages
  run: |
      "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
      "platform-tools" \
      "platforms;android-35" \
      "ndk;28.2.13676358"
        

    - name: Install Android platform and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "ndk;28.2.13676358"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "NDKAPI=23" >> "$GITHUB_ENV"
          echo "ANDROIDNDKVER=r28c" >> "$GITHUB_ENV"

      - name: Build APK with python-for-android
        run: |
          chmod +x ./build_android.sh
          ./build_android.sh

      - name: Find generated APK
        id: apk
        shell: bash
        run: |
          APK="$(find "$HOME/.local/share/python-for-android" -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo 'No APK was produced by python-for-android.' >&2
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/kivy-android.apk
          echo "path=artifacts/kivy-android.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kivy-android-apk
          path: artifacts/kivy-android.apk
          if-no-files-found: error
          retention-days: 14
          
